<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Portfolio Romain Goldenchtein</title>
    <meta
      name="description"
      content="Romain Goldenchtein, élève ingénieur en intelligence artificielle à l'Université de Tokyo : projets, expériences et CV à explorer sur un Rubik's Cube en 3D."
    />
    <link rel="canonical" href="https://goldenrom.vercel.app/" />
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://goldenrom.vercel.app/" />
    <meta property="og:title" content="Romain Goldenchtein · Portfolio" />
    <meta
      property="og:description"
      content="Romain Goldenchtein, élève ingénieur en intelligence artificielle à l'Université de Tokyo : projets, expériences et CV à explorer sur un Rubik's Cube en 3D."
    />
    <meta property="og:image" content="https://goldenrom.vercel.app/assets/og-image.jpg" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="Romain Goldenchtein, portfolio interactif en Rubik's Cube" />
    <meta property="og:locale" content="fr_FR" />
    <meta property="og:locale:alternate" content="en_US" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="theme-color" content="#eceafb" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#0d0b26" media="(prefers-color-scheme: dark)" />
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "Person",
        "name": "Romain Goldenchtein",
        "url": "https://goldenrom.vercel.app/",
        "image": "https://goldenrom.vercel.app/assets/og-image.jpg",
        "jobTitle": "Étudiant ingénieur en intelligence artificielle",
        "affiliation": [
          { "@type": "CollegeOrUniversity", "name": "Université de Technologie de Troyes" },
          { "@type": "CollegeOrUniversity", "name": "The University of Tokyo" }
        ],
        "knowsAbout": ["Reinforcement learning", "Machine learning", "Deep learning", "Python"],
        "email": "mailto:r.goldenchtein@proton.me",
        "sameAs": ["https://github.com/Kiyogen24", "https://www.linkedin.com/in/romain-goldenchtein/"]
      }
    </script>
    <link rel="icon" type="image/png" href="assets/previews/rubik.png" />
    <script>
      // thème posé avant le premier affichage, pour éviter un flash clair en mode sombre
      try {
        document.documentElement.dataset.theme =
          localStorage.getItem('theme') || (matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
      } catch {
        document.documentElement.dataset.theme = 'light';
      }
      document.documentElement.classList.add('js');
      // le texte d'accueil s'affiche même si le cube ne démarre jamais
      setTimeout(() => document.documentElement.classList.add('is-ready'), 6000);
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,700;12..96,800&family=Instrument+Sans:wght@400;500;600&display=swap"
    />
    <link rel="stylesheet" href="css/main.css" />
    <script async src="https://unpkg.com/es-module-shims@1.8.0/dist/es-module-shims.js"></script>
    <script type="importmap">
      { "imports": { "three": "https://unpkg.com/three@0.152.2/build/three.module.js" } }
    </script>
    <script type="module" src="js/main.js"></script>
  </head>
  <body>
    <header class="bar">
      <a class="brand" href="./" id="home"
        ><span class="mark" id="mark" aria-hidden="true"
          ><span></span><span></span><span></span><span></span><span></span><span></span><span></span><span></span
          ><span></span></span
        >Rubik-folio</a
      >
      <div class="tools">
        <div class="lang" role="group" data-i18n-label="language">
          <button type="button" data-lang="fr" aria-pressed="false">FR</button>
          <button type="button" data-lang="en" aria-pressed="false">EN</button>
        </div>
        <button type="button" class="icon-btn" id="theme" data-i18n-label="theme">
          <svg
            width="18"
            height="18"
            viewBox="0 0 24 24"
            aria-hidden="true"
            fill="none"
            stroke="currentColor"
            stroke-width="2"
            stroke-linecap="round"
          >
            <circle cx="12" cy="12" r="4.2" />
            <path
              d="M12 2.5v2.2M12 19.3v2.2M4.6 4.6l1.6 1.6M17.8 17.8l1.6 1.6M2.5 12h2.2M19.3 12h2.2M4.6 19.4l1.6-1.6M17.8 6.2l1.6-1.6"
            />
          </svg>
        </button>
      </div>
    </header>

    <!-- le cube, derrière la page ; son cadrage suit le défilement -->
    <canvas id="cube" tabindex="0" role="img"></canvas>

    <main>
      <section class="page" id="intro" aria-labelledby="name">
        <div class="intro-text">
          <h1 id="name" class="lines">
            <span class="line"><span data-line style="--i: 0">Romain</span></span>
            <span class="line"><span data-line style="--i: 1">Goldenchtein</span></span>
          </h1>
          <p class="tagline" data-rise style="--i: 0" data-i18n="tagline"></p>
          <p class="actions" data-rise style="--i: 1">
            <!-- chaque bouton porte la couleur de la carte qu'il ouvre : le CV (face jaune), « À propos » (l'indigo) -->
            <button type="button" class="btn primary" id="open-cv">
              <span class="sticker" style="--c: var(--face-bottom)" aria-hidden="true"></span
              ><span data-i18n="cv"></span>
            </button>
            <button type="button" class="btn secondary" id="open-about">
              <span class="sticker" style="--c: var(--primary)" aria-hidden="true"></span
              ><span data-i18n="about"></span>
            </button>
          </p>
        </div>
        <nav class="contacts" id="contacts" aria-label="Contact">
          <span class="contacts-row" data-rise style="--i: 3">
            <a href="https://www.linkedin.com/in/romain-goldenchtein/" target="_blank" rel="noopener">LinkedIn</a>
            <a href="https://github.com/Kiyogen24" target="_blank" rel="noopener">GitHub</a>
            <a href="mailto:r.goldenchtein@proton.me">r.goldenchtein@proton.me</a>
          </span>
        </nav>
      </section>
      <section class="page" id="cube-view" aria-labelledby="cube-title">
        <h2 class="visually-hidden" id="cube-title" data-i18n="cubeTitle"></h2>
      </section>
    </main>

    <!-- sous le cube : le patron et la face devant, puis les commandes du jeu -->
    <div class="cube-ui" id="cube-ui">
      <div class="cube-row" id="row-explore" hidden>
        <div class="readout">
          <div class="net" id="net" role="group">
            <button type="button" class="u" data-face="top" style="--c: var(--face-top)"></button>
            <button type="button" class="f" data-face="front" style="--c: var(--face-front)"></button>
            <button type="button" class="r" data-face="right" style="--c: var(--face-right)"></button>
            <button type="button" class="b" data-face="back" style="--c: var(--face-back)"></button>
            <button type="button" class="l" data-face="left" style="--c: var(--face-left)"></button>
            <button type="button" class="d" data-face="bottom" style="--c: var(--face-bottom)"></button>
          </div>
          <p class="readout-text" aria-live="polite">
            <span class="readout-face" id="face-name"></span><span class="readout-count" id="face-count"></span>
          </p>
        </div>
        <button type="button" class="btn secondary small" id="play">
          <svg width="16" height="16" viewBox="0 0 16 16" aria-hidden="true">
            <rect x="1.5" y="1.5" width="5.5" height="5.5" rx="1.4" fill="var(--face-front)" />
            <rect x="9" y="1.5" width="5.5" height="5.5" rx="1.4" fill="var(--face-right)" />
            <rect x="1.5" y="9" width="5.5" height="5.5" rx="1.4" fill="var(--face-back)" />
            <rect x="9" y="9" width="5.5" height="5.5" rx="1.4" fill="var(--face-left)" />
          </svg>
          <span data-i18n="play"></span>
        </button>
      </div>
      <div class="cube-row" id="row-play" hidden>
        <div class="play-panel">
          <p class="status" id="status" aria-live="polite"></p>
          <div class="play-actions">
            <button type="button" class="btn primary small" id="shuffle" data-i18n="shuffle"></button>
            <button type="button" class="btn secondary small" id="solve" data-i18n="solve"></button>
            <button type="button" class="btn quiet small" id="done" data-i18n="done"></button>
          </div>
          <p class="hint" data-i18n="playHint"></p>
        </div>
      </div>
    </div>

    <article class="card" id="card" hidden aria-labelledby="card-title">
      <button type="button" class="icon-btn card-close" id="card-close" data-i18n-label="close">
        <svg width="14" height="14" viewBox="0 0 14 14" aria-hidden="true">
          <path d="M2 2l10 10M12 2L2 12" stroke="currentColor" stroke-width="2" stroke-linecap="round" fill="none" />
        </svg>
      </button>
      <div class="card-scroll" id="card-scroll">
        <header class="card-head">
          <div class="socket">
            <div class="tile" id="card-tile"><img id="card-img" alt="" /></div>
          </div>
          <div>
            <h2 id="card-title" tabindex="-1"></h2>
            <p class="card-org" id="card-org"></p>
            <p class="card-meta" id="card-meta"></p>
          </div>
        </header>
        <div class="card-body" id="card-body"></div>
      </div>
      <footer class="card-foot" id="card-foot"></footer>
    </article>

    <div class="tag" id="tag" aria-hidden="true"></div>
    <p class="loading" id="loading" hidden data-i18n="loading"></p>
  </body>
</html>
